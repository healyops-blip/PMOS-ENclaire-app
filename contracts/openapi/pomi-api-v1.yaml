openapi: 3.1.0
info:
  title: Pomi API
  version: 0.1.0
  description: |
    Pomi P0 Flutter/FastAPI contract. All medical data in the hackathon build is
    simulated. OCR output remains a draft until explicitly confirmed by the user.
    Hospital certification is a Flutter-only local demo and is intentionally absent.
    Authentication and health endpoints are already implemented and therefore use
    their direct response models. The remaining business endpoints are the agreed
    P0 contract and use the ApiSuccess/ApiError envelope until implemented.
servers:
  - url: https://api.healy1012-ops.top
    description: Demo server
  - url: http://127.0.0.1:8000
    description: Local development
security:
  - SessionBearer: []
tags:
  - name: System
  - name: Auth
  - name: Patient
  - name: Dashboard
  - name: Medications
  - name: Cycles
  - name: Weights
  - name: Documents
  - name: OCR
  - name: Reconciliations
  - name: Reports
  - name: Rules

paths:
  /health/live:
    get:
      tags: [System]
      operationId: getLiveness
      summary: Check whether the FastAPI process is alive
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /health/ready:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Check whether FastAPI and SQLite are ready
      security: []
      responses:
        '200':
          description: API and database are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /api/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register an account without creating a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '409':
          $ref: '#/components/responses/AuthErrorResponse'
        '422':
          $ref: '#/components/responses/AuthErrorResponse'
        '429':
          $ref: '#/components/responses/AuthErrorResponse'

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with account name and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/AuthErrorResponse'
        '422':
          $ref: '#/components/responses/AuthErrorResponse'
        '429':
          $ref: '#/components/responses/AuthErrorResponse'

  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentAccount
      summary: Restore the current account from a Bearer session
      responses:
        '200':
          description: Current account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/AuthErrorResponse'

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/AuthErrorResponse'

  /api/patient/profile:
    get:
      tags: [Patient]
      operationId: getPatientProfile
      summary: Get the current patient's profile
      responses:
        '200':
          description: Patient profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PatientProfile'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    put:
      tags: [Patient]
      operationId: updatePatientProfile
      summary: Partially save onboarding or update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientProfileUpdate'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PatientProfile'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'

  /api/dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Get the fault-isolated patient dashboard aggregate
      responses:
        '200':
          description: Dashboard aggregate
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Dashboard'

  /api/medications:
    get:
      tags: [Medications]
      operationId: listMedications
      summary: List current or historical medications
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/MedicationStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Medication page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MedicationPage'
    post:
      tags: [Medications]
      operationId: createMedication
      summary: Add a medication and its first event
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationCreate'
      responses:
        '201':
          description: Medication created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MedicationMutationResult'
        '422':
          $ref: '#/components/responses/ErrorResponse'

  /api/medications/{medication_id}:
    put:
      tags: [Medications]
      operationId: updateMedication
      summary: Adjust, pause, resume, or stop a medication
      parameters:
        - $ref: '#/components/parameters/MedicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationUpdate'
      responses:
        '200':
          description: Medication and event updated atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MedicationMutationResult'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'

  /api/medications/{medication_id}/events:
    get:
      tags: [Medications]
      operationId: listMedicationEvents
      summary: Get the immutable medication event chain
      parameters:
        - $ref: '#/components/parameters/MedicationId'
      responses:
        '200':
          description: Medication events in chronological order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MedicationEvent'

  /api/medications/{medication_id}/daily-status:
    put:
      tags: [Medications]
      operationId: setMedicationDailyStatus
      summary: Set one of taken, missed, or unrecorded for a date
      parameters:
        - $ref: '#/components/parameters/MedicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationDailyUpsert'
      responses:
        '200':
          description: Daily record upserted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MedicationDailyMutation'

  /api/medication-daily:
    get:
      tags: [Medications]
      operationId: listMedicationDaily
      summary: Get daily medication records in a date range
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: medication_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Daily records and three-state totals
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MedicationDailyRange'

  /api/cycles:
    get:
      tags: [Cycles]
      operationId: listCycles
      summary: List menstrual cycles
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Menstrual cycles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MenstrualCycle'
    post:
      tags: [Cycles]
      operationId: createCycle
      summary: Create a menstrual cycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CycleInput'
      responses:
        '201':
          description: Cycle created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MenstrualCycle'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /api/cycles/{cycle_id}:
    put:
      tags: [Cycles]
      operationId: updateCycle
      summary: Update a menstrual cycle
      parameters:
        - name: cycle_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CycleInput'
      responses:
        '200':
          description: Cycle updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MenstrualCycle'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Cycles]
      operationId: deleteCycle
      summary: Soft-delete a menstrual cycle
      parameters:
        - name: cycle_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Cycle deleted
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /api/weights:
    get:
      tags: [Weights]
      operationId: listWeights
      summary: List weight records
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Weight records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WeightRecord'
    post:
      tags: [Weights]
      operationId: createWeight
      summary: Create or replace the record for the same local date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeightInput'
      responses:
        '200':
          description: Existing same-day record updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WeightRecord'
        '201':
          description: Weight record created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WeightRecord'

  /api/weights/{weight_id}:
    put:
      tags: [Weights]
      operationId: updateWeight
      summary: Update a weight record
      parameters:
        - name: weight_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeightInput'
      responses:
        '200':
          description: Weight record updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WeightRecord'

  /api/documents:
    get:
      tags: [Documents]
      operationId: listDocuments
      summary: List non-deleted medical documents
      parameters:
        - name: document_type
          in: query
          schema:
            $ref: '#/components/schemas/DocumentType'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Document page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DocumentPage'
    post:
      tags: [Documents]
      operationId: uploadDocument
      summary: Upload an original image or single-page PDF
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, document_type]
              properties:
                file:
                  type: string
                  format: binary
                document_type:
                  $ref: '#/components/schemas/DocumentType'
                external_processing_consent_version:
                  type: [string, 'null']
                  maxLength: 40
      responses:
        '201':
          description: File stored and document created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DocumentDetail'
        '413':
          $ref: '#/components/responses/ErrorResponse'
        '415':
          $ref: '#/components/responses/ErrorResponse'

  /api/documents/{document_id}:
    get:
      tags: [Documents]
      operationId: getDocument
      summary: Get document details and current revision
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DocumentDetail'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: Soft delete a document
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Soft deletion scheduled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeleteResult'

  /api/documents/{document_id}/revisions:
    get:
      tags: [Documents]
      operationId: listDocumentRevisions
      summary: List all document revisions
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Revision chain
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DocumentRevision'
    post:
      tags: [Documents]
      operationId: replaceDocumentRevision
      summary: Upload a replacement while preserving the old revision
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, replacement_reason, expected_current_revision_id]
              properties:
                file:
                  type: string
                  format: binary
                replacement_reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                expected_current_revision_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: New revision created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DocumentRevision'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /api/documents/{document_id}/revisions/{revision_id}/file:
    get:
      tags: [Documents]
      operationId: downloadDocumentRevision
      summary: Stream a private original file after ownership checks
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Original image or PDF
          headers:
            Content-Disposition:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /api/ocr/tasks:
    post:
      tags: [OCR]
      operationId: createOcrTask
      summary: Queue OCR for a specific document revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OcrTaskCreate'
      responses:
        '201':
          description: OCR task queued or existing idempotent task returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OcrTask'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'

  /api/ocr/tasks/{task_id}:
    get:
      tags: [OCR]
      operationId: getOcrTask
      summary: Poll OCR task status
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: OCR task
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OcrTask'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /api/ocr/tasks/{task_id}/result:
    get:
      tags: [OCR]
      operationId: getOcrResult
      summary: Get the editable OCR draft and field-level evidence
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: OCR draft
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OcrDraftResult'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /api/ocr/tasks/{task_id}/confirm:
    post:
      tags: [OCR]
      operationId: confirmOcrResult
      summary: Atomically confirm a laboratory, clinical-text, or medical-order OCR draft
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/LabConfirmRequest'
                - $ref: '#/components/schemas/ClinicalTextConfirmRequest'
                - $ref: '#/components/schemas/MedicalOrderConfirmRequest'
      responses:
        '200':
          description: OCR result confirmed and formal records created atomically
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/LabConfirmResult'
                          - $ref: '#/components/schemas/ClinicalTextConfirmResult'
                          - $ref: '#/components/schemas/MedicalOrderConfirmationResult'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'

  /api/ocr/tasks/{task_id}/retry:
    post:
      tags: [OCR]
      operationId: retryOcrTask
      summary: Create a new user-requested OCR attempt
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OcrRetryRequest'
      responses:
        '201':
          description: New OCR attempt queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OcrTask'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /api/lab-observations:
    get:
      tags: [Laboratory]
      operationId: listLabObservations
      summary: List confirmed laboratory observations for the current patient
      responses:
        '200':
          description: Patient-scoped confirmed observations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/LabObservation'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /api/lab-observations/{observation_id}:
    get:
      tags: [Laboratory]
      operationId: getLabObservation
      summary: Get one patient-scoped confirmed laboratory observation
      parameters:
        - name: observation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Confirmed observation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LabObservation'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /api/medication-reconciliations:
    post:
      tags: [Reconciliations]
      operationId: createMedicationReconciliation
      summary: Generate a deterministic medication reconciliation draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconciliationCreate'
      responses:
        '201':
          description: Reconciliation draft created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MedicationReconciliation'

  /api/medication-reconciliations/{reconciliation_id}:
    get:
      tags: [Reconciliations]
      operationId: getMedicationReconciliation
      summary: Get reconciliation draft and item differences
      parameters:
        - $ref: '#/components/parameters/ReconciliationId'
      responses:
        '200':
          description: Reconciliation detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MedicationReconciliation'
    put:
      tags: [Reconciliations]
      operationId: confirmMedicationReconciliation
      summary: Save all user decisions and apply medication events atomically
      parameters:
        - $ref: '#/components/parameters/ReconciliationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconciliationUpdate'
      responses:
        '200':
          description: Reconciliation confirmed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MedicationReconciliation'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'

  /api/patient-notes:
    post:
      tags: [Reports]
      operationId: createPatientNote
      summary: Create a patient-note draft for the current visit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientNoteInput'
      responses:
        '201':
          description: Patient note created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PatientNote'

  /api/patient-notes/latest:
    get:
      tags: [Reports]
      operationId: getLatestPatientNote
      summary: Get the latest patient note draft, confirmation, skip or consumed record
      responses:
        '200':
          description: Latest note or null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/PatientNote'
                          - type: 'null'

  /api/patient-notes/{note_id}:
    put:
      tags: [Reports]
      operationId: updatePatientNote
      summary: Update an unconsumed patient-note draft
      parameters:
        - name: note_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientNoteInput'
      responses:
        '200':
          description: Patient note updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PatientNote'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /api/patient-notes/{note_id}/confirm:
    post:
      tags: [Reports]
      operationId: confirmPatientNote
      summary: Idempotently confirm a patient note
      parameters:
        - $ref: '#/components/parameters/PatientNoteId'
      responses:
        '200':
          description: Patient note confirmed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PatientNote'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /api/patient-notes/{note_id}/skip:
    post:
      tags: [Reports]
      operationId: skipPatientNote
      summary: Idempotently skip a patient note
      parameters:
        - $ref: '#/components/parameters/PatientNoteId'
      responses:
        '200':
          description: Patient note skipped
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PatientNote'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /api/patient-notes/{note_id}/copy:
    post:
      tags: [Reports]
      operationId: copyPatientNote
      summary: Copy a prior patient note into a new editable draft
      parameters:
        - $ref: '#/components/parameters/PatientNoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientNoteCopy'
      responses:
        '201':
          description: New patient-note draft created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PatientNote'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /api/reports/preflight:
    post:
      tags: [Reports]
      operationId: preflightReport
      summary: Return missing confirmed sections before snapshot generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreate'
      responses:
        '200':
          description: Deterministic report completeness result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReportPreflight'

  /api/reports:
    get:
      tags: [Reports]
      operationId: listReports
      summary: List immutable report history, newest first
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Report page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReportPage'
    post:
      tags: [Reports]
      operationId: createReport
      summary: Generate an immutable report snapshot from confirmed data
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreate'
      responses:
        '201':
          description: Report snapshot generated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReportListItem'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /api/reports/{report_id}:
    get:
      tags: [Reports]
      operationId: getReport
      summary: Read one immutable report snapshot with three-layer traceability
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Three-layer report data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReportDetail'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /api/reports/{report_id}/pdf:
    post:
      tags: [Reports]
      operationId: createReportPdf
      summary: Queue PDF generation for an immutable report
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: PDF generation queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReportPdf'
    get:
      tags: [Reports]
      operationId: getReportPdf
      summary: Get PDF generation status and download metadata
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: PDF status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReportPdf'

  /api/reports/{report_id}/pdf/file:
    get:
      tags: [Reports]
      operationId: downloadReportPdf
      summary: Stream the generated report PDF
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /api/deterministic-rules:
    get:
      tags: [Rules]
      operationId: listDeterministicRules
      summary: List enabled deterministic rule configurations
      responses:
        '200':
          description: Rule configurations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeterministicRule'

  /api/deterministic-rules/{rule_id}:
    put:
      tags: [Rules]
      operationId: updateDeterministicRule
      summary: Update controlled rule parameters (admin only)
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeterministicRuleUpdate'
      responses:
        '200':
          description: Rule updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeterministicRule'
        '403':
          $ref: '#/components/responses/ErrorResponse'

  /api/rule-executions/{execution_id}:
    get:
      tags: [Rules]
      operationId: getRuleExecution
      summary: Trace deterministic rule input and output
      parameters:
        - name: execution_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rule execution trace
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RuleExecution'

components:
  securitySchemes:
    SessionBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-id

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    FromDate:
      name: from
      in: query
      schema:
        type: string
        format: date
    ToDate:
      name: to
      in: query
      schema:
        type: string
        format: date
    MedicationId:
      name: medication_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PatientNoteId:
      name: note_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReconciliationId:
      name: reconciliation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: report_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ErrorResponse:
      description: API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthErrorResponse:
      description: Implemented authentication API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'

  schemas:
    ApiSuccess:
      type: object
      required: [success, data, request_id, error]
      properties:
        success:
          type: boolean
          const: true
        data: {}
        request_id:
          type: string
        error:
          type: 'null'

    ApiError:
      type: object
      required: [success, data, request_id, error]
      properties:
        success:
          type: boolean
          const: false
        data:
          type: 'null'
        request_id:
          type: string
        error:
          $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      required: [code, message, retryable, details]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        retryable:
          type: boolean
        retry_after_seconds:
          type: [integer, 'null']
          minimum: 0
        details:
          type: object
          additionalProperties: true

    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - ACCOUNT_NAME_TAKEN
        - INVALID_CREDENTIALS
        - AUTHENTICATION_REQUIRED
        - AUTH_RATE_LIMITED
        - SESSION_EXPIRED
        - FORBIDDEN_RESOURCE
        - RESOURCE_NOT_FOUND
        - RESOURCE_VERSION_CONFLICT
        - RATE_LIMITED
        - UNSUPPORTED_FORMAT
        - FILE_TOO_LARGE
        - IMAGE_TOO_LARGE
        - MULTI_PAGE_PDF
        - MODEL_TIMEOUT
        - INVALID_MODEL_JSON
        - SCHEMA_VALIDATION_FAILED
        - CRITICAL_FIELD_MISSING
        - OCR_RESULT_NOT_READY
        - OCR_ALREADY_CONFIRMED
        - RECONCILIATION_REQUIRED
        - CYCLE_DATE_OVERLAP
        - REPORT_SOURCE_INCOMPLETE
        - PDF_GENERATION_FAILED

    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [account_name, password]
      properties:
        account_name:
          type: string
          minLength: 3
          maxLength: 64
          description: Trimmed and normalized to lowercase before the backend applies ^[a-z0-9][a-z0-9_.-]{2,63}$.
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
          description: Must contain at least one letter and one number.
        phone_number:
          type: [string, 'null']
          maxLength: 32
          description: Optional and unverified; spaces and hyphens are removed before validating optional + followed by 7-20 digits.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [account_name, password]
      properties:
        account_name:
          type: string
          minLength: 3
          maxLength: 64
          description: Trimmed and normalized to lowercase by the backend.
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
        client_platform:
          type: [string, 'null']
          maxLength: 32
        device_name:
          type: [string, 'null']
          maxLength: 128

    AccountResponse:
      type: object
      required: [uid, account_name, account_type, onboarding_completed, status, phone_number, phone_verified]
      properties:
        uid:
          type: string
          format: uuid
        account_name:
          type: string
        account_type:
          type: string
          enum: [user, admin]
        onboarding_completed:
          type: boolean
        status:
          type: string
          enum: [active, disabled, locked]
        phone_number:
          type: [string, 'null']
        phone_verified:
          type: boolean

    LoginResponse:
      type: object
      required: [session_id, token_type, expires_at, account]
      properties:
        session_id:
          type: string
          minLength: 32
          readOnly: true
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: string
          format: date-time
        account:
          $ref: '#/components/schemas/AccountResponse'

    AuthErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - ACCOUNT_NAME_TAKEN
            - INVALID_CREDENTIALS
            - AUTHENTICATION_REQUIRED
            - AUTH_RATE_LIMITED
        message:
          type: string

    AuthErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/AuthErrorDetail'

    Gender:
      type: string
      enum: [female, male, other, prefer_not_to_say]

    PatientProfileUpdate:
      type: object
      minProperties: 1
      properties:
        nickname:
          type: [string, 'null']
          maxLength: 80
        birth_date:
          type: [string, 'null']
          format: date
        gender:
          oneOf:
            - $ref: '#/components/schemas/Gender'
            - type: 'null'
        height_cm:
          type: [number, 'null']
          minimum: 80
          maximum: 250
        diagnosis_year:
          type: [integer, 'null']
          minimum: 1900
        primary_condition:
          type: [string, 'null']
          maxLength: 80
        usual_cycle_length_days:
          type: [integer, 'null']
          minimum: 15
          maximum: 120
        last_menstrual_start_date:
          type: [string, 'null']
          format: date
        next_visit_date:
          type: [string, 'null']
          format: date
        health_goal:
          type: [string, 'null']
          maxLength: 500
        accept_external_ocr_notice:
          type: [boolean, 'null']
        complete_onboarding:
          type: [boolean, 'null']
        updated_at:
          type: [string, 'null']
          format: date-time

    PatientProfile:
      type: object
      required: [patient_id, account_uid, onboarding_step, onboarding_completed, created_at, updated_at]
      properties:
        patient_id:
          type: string
          format: uuid
        account_uid:
          type: string
        nickname:
          type: [string, 'null']
        birth_date:
          type: [string, 'null']
          format: date
        gender:
          oneOf:
            - $ref: '#/components/schemas/Gender'
            - type: 'null'
        height_cm:
          type: [number, 'null']
        diagnosis_year:
          type: [integer, 'null']
        primary_condition:
          type: [string, 'null']
        usual_cycle_length_days:
          type: [integer, 'null']
        last_menstrual_start_date:
          type: [string, 'null']
          format: date
        next_visit_date:
          type: [string, 'null']
          format: date
        health_goal:
          type: [string, 'null']
        onboarding_step:
          type: integer
          minimum: 0
          maximum: 4
        onboarding_completed:
          type: boolean
        external_ocr_notice_accepted_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    IntakeStatus:
      type: string
      enum: [taken, missed, unrecorded]

    MedicationStatus:
      type: string
      enum: [active, paused, stopped]

    MedicationEventType:
      type: string
      enum: [created, adjusted, paused, resumed, stopped]

    MedicationUpdateEventType:
      type: string
      enum: [adjusted, paused, resumed, stopped]

    MedicationSourceCategory:
      type: string
      enum: [prescribed, supplement, other_long_term]

    MedicationSourceType:
      type: string
      enum: [manual, medical_order, outpatient_record, imported]

    StopSource:
      type: string
      enum: [written_order, verbal_doctor, patient_self, other]

    MedicationInstruction:
      type: object
      properties:
        drug_name:
          type: string
          minLength: 1
          maxLength: 200
        specification:
          type: [string, 'null']
          maxLength: 200
        dosage_value:
          type: [number, 'null']
          minimum: 0
        dosage_unit:
          type: [string, 'null']
          maxLength: 50
        frequency:
          type: [string, 'null']
          maxLength: 100
        route:
          type: [string, 'null']
          maxLength: 100

    MedicationCreate:
      allOf:
        - $ref: '#/components/schemas/MedicationInstruction'
        - type: object
          required: [drug_name, source_category, start_date, event_date]
          properties:
            source_category:
              $ref: '#/components/schemas/MedicationSourceCategory'
            start_date:
              type: string
              format: date
            source_type:
              $ref: '#/components/schemas/MedicationSourceType'
            source_document_id:
              type: [string, 'null']
              format: uuid
            event_date:
              type: string
              format: date
            note:
              type: [string, 'null']
              maxLength: 500

    MedicationUpdate:
      allOf:
        - $ref: '#/components/schemas/MedicationInstruction'
        - type: object
          required: [event_type, event_date, updated_at]
          properties:
            event_type:
              $ref: '#/components/schemas/MedicationUpdateEventType'
            event_date:
              type: string
              format: date
            stop_source:
              oneOf:
                - $ref: '#/components/schemas/StopSource'
                - type: 'null'
            change_reason:
              type: [string, 'null']
              maxLength: 500
            note:
              type: [string, 'null']
              maxLength: 500
            updated_at:
              type: string
              format: date-time
      description: |
        `adjusted` creates a new medication version rather than overwriting the
        existing instruction. The old version is ended and the returned new
        version links back through `replaces_medication_id`. `paused`, `resumed`,
        and `stopped` append immutable events to the medication timeline.

    Medication:
      allOf:
        - $ref: '#/components/schemas/MedicationInstruction'
        - type: object
          required: [id, patient_id, drug_name, status, source_category, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
            patient_id:
              type: string
              format: uuid
            normalized_drug_name:
              type: [string, 'null']
            start_date:
              type: [string, 'null']
              format: date
            end_date:
              type: [string, 'null']
              format: date
            status:
              $ref: '#/components/schemas/MedicationStatus'
            source_category:
              $ref: '#/components/schemas/MedicationSourceCategory'
            replaces_medication_id:
              type: [string, 'null']
              format: uuid
              description: Previous medication version replaced by this record.
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    MedicationEvent:
      type: object
      required: [id, medication_id, event_type, event_date, created_at]
      properties:
        id:
          type: string
          format: uuid
        medication_id:
          type: string
          format: uuid
        event_type:
          $ref: '#/components/schemas/MedicationEventType'
        event_date:
          type: string
          format: date
        old_instruction:
          type: [object, 'null']
          additionalProperties: true
        new_instruction:
          type: [object, 'null']
          additionalProperties: true
        source_document_id:
          type: [string, 'null']
          format: uuid
        stop_source:
          oneOf:
            - $ref: '#/components/schemas/StopSource'
            - type: 'null'
        note:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time

    MedicationMutationResult:
      type: object
      required: [medication, event]
      properties:
        medication:
          $ref: '#/components/schemas/Medication'
        replaced_medication:
          oneOf:
            - $ref: '#/components/schemas/Medication'
            - type: 'null'
          description: Ended prior version when an adjustment creates a replacement.
        event:
          $ref: '#/components/schemas/MedicationEvent'

    PageMeta:
      type: object
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean

    MedicationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [server_date, items, groups]
          properties:
            server_date:
              type: string
              format: date
              description: Server business date used for all medication writes.
            items:
              type: array
              items:
                $ref: '#/components/schemas/Medication'
            groups:
              type: object
