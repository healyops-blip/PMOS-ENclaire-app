[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pomi-backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=25,<26",
  "fastapi>=0.128,<0.129",
  "pydantic>=2.12,<3",
  "sqlalchemy>=2.0,<3",
  "starlette>=0.49.1,<0.51",
  "uvicorn>=0.40,<1",
]
dynamic = ["version"]

[project.scripts]
pomi-admin = "pomi_backend.admin.__main__:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8.3,<10",
  "pyyaml>=6.0,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.version]
path = "src/pomi_backend/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pomi_backend"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
