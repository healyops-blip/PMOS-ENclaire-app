title = "Pomi secret scanning"

[extend]
useDefault = true

[allowlist]
description = "Allow only documented and test-only synthetic passwords"
condition = "AND"
paths = [
  '''^docs/backend-api\.md$''',
  '''^backend/tests/test_admin_accounts\.py$''',
  '''^backend/tests/test_medication_api\.py$''',
  '''^backend/tests/test_dashboard_api\.py$''',
  '''^backend/tests/test_ocr_recognize_api\.py$''',
  '''^backend/tests/test_sync_ocr_confirmation\.py$''',
]
regexes = [
  '''^StrongPass123$''',
  '''^IgnoredPass123$''',
  '''^Medication123$''',
  '''^Dashboard123$''',
  '''^RecognizePass123$''',
  '''^SyncOcrPass123$''',
]
