<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pomi Flutter mobile preview.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pomi_mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pomi Mobile Preview</title>
  <link rel="manifest" href="manifest.json">
  <style>
    @font-face {
      font-family: 'Noto Sans SC';
      src: url('assets/assets/fonts/NotoSansSC-Regular.ttf') format('truetype');
      font-style: normal;
      font-weight: 400;
      font-display: block;
    }
    @font-face {
      font-family: 'Noto Sans SC';
      src: url('assets/assets/fonts/NotoSansSC-Medium.ttf') format('truetype');
      font-style: normal;
      font-weight: 500;
      font-display: block;
    }
    @font-face {
      font-family: 'Noto Sans SC';
      src: url('assets/assets/fonts/NotoSansSC-Bold.ttf') format('truetype');
      font-style: normal;
      font-weight: 700;
      font-display: block;
    }
    @font-face {
      font-family: 'Noto Sans SC';
      src: url('assets/assets/fonts/NotoSansSC-ExtraBold.ttf') format('truetype');
      font-style: normal;
      font-weight: 800;
      font-display: block;
    }
    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #f0ecf4;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      box-sizing: border-box;
      padding: 20px;
      overflow: hidden;
      font-family: 'Noto Sans SC', sans-serif;
    }

    .device-frame {
      width: min(375px, calc(100vw - 40px)) !important;
      height: min(812px, calc(100vh - 40px)) !important;
      border: 2px solid #111111;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(74, 46, 107, 0.16);
      background:
        radial-gradient(circle at 100% 0%, rgba(221, 245, 255, .72), transparent 54%),
        radial-gradient(circle at 100% 36%, rgba(110, 80, 230, .48), transparent 58%),
        radial-gradient(circle at 0% 72%, rgba(242, 154, 211, .40), transparent 62%),
        #fffefa;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .system-status-bar {
      position: relative;
      flex: 0 0 30px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 13px;
      box-sizing: border-box;
      color: #111111;
      background: transparent;
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      user-select: none;
      z-index: 2;
      transition: color 160ms ease, background 160ms ease;
    }

    .system-status-bar.auth-screen {
      color: #111111;
      background: transparent;
    }

    .device-frame.auth-mode .system-status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
    }

    .device-frame.auth-mode iframe {
      height: 100%;
      flex: 1 1 100%;
    }

    .system-time {
      justify-self: start;
      min-width: 40px;
      text-align: center;
    }

    .camera-island {
      width: 76px;
      height: 20px;
      border-radius: 999px;
      background: #050505;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    .system-indicators {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .system-indicators svg {
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .battery-level {
      fill: currentColor;
      stroke: none;
    }

    .device-frame iframe {
      display: block;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      border: 0;
    }

    .backend-switch {
      position: fixed;
      top: 16px;
      right: 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid rgba(74, 46, 107, 0.18);
      border-radius: 999px;
      color: #4a2e6b;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 6px 20px rgba(74, 46, 107, 0.12);
      font: 600 13px/1 'Noto Sans SC', sans-serif;
      cursor: default;
      z-index: 10;
    }

    .backend-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d49b24;
      box-shadow: 0 0 0 3px rgba(212, 155, 36, 0.14);
    }

    .backend-status.online {
      background: #2e9b63;
      box-shadow: 0 0 0 3px rgba(46, 155, 99, 0.14);
    }

    .backend-status.offline {
      background: #c84c55;
      box-shadow: 0 0 0 3px rgba(200, 76, 85, 0.14);
    }

    @media (max-width: 720px) {
      .backend-switch {
        top: 6px;
        right: 8px;
        min-height: 30px;
        padding: 0 10px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="backend-switch" title="Preview 使用前端内存 smoke 数据">
    <span class="backend-status online" aria-hidden="true"></span>
    <span>数据：Smoke</span>
  </div>
  <main class="device-frame">
    <div class="system-status-bar" aria-label="模拟手机系统状态栏">
      <span class="system-time" id="system-time">9:41</span>
      <span class="camera-island" aria-label="前置摄像头"></span>
      <span class="system-indicators" aria-label="网络与电量">
        <svg width="15" height="11" viewBox="0 0 15 11" aria-hidden="true">
          <path d="M1 10V8.5M5 10V6M9 10V3.5M13 10V1" stroke-width="2.2"></path>
        </svg>
        <svg width="14" height="11" viewBox="0 0 14 11" aria-hidden="true">
          <path d="M1 3.5C4.4.5 9.6.5 13 3.5M3.2 6C5.4 4.1 8.6 4.1 10.8 6M5.7 8.4C6.5 7.8 7.5 7.8 8.3 8.4"></path>
          <circle cx="7" cy="9.6" r=".7" fill="currentColor" stroke="none"></circle>
        </svg>
        <svg width="20" height="10" viewBox="0 0 20 10" aria-hidden="true">
          <rect x=".8" y=".8" width="16" height="8.4" rx="2"></rect>
          <path d="M18.2 3.2V6.8"></path>
          <rect class="battery-level" x="2.4" y="2.4" width="12.8" height="5.2" rx="1"></rect>
        </svg>
      </span>
    </div>
    <iframe src="app.html?v=20260829-0062" title="Pomi Flutter mobile preview"></iframe>
  </main>
  <script>
    const updateSystemTime = () => {
      const now = new Date();
      document.getElementById('system-time').textContent =
        `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
    };
    const updateStatusBarTheme = () => {
      const isAuthScreen = /#\/(login|onboarding)/.test(window.location.hash);
      document.querySelector('.system-status-bar')
        .classList.toggle('auth-screen', isAuthScreen);
      document.querySelector('.device-frame')
        .classList.toggle('auth-mode', isAuthScreen);
    };
    updateSystemTime();
    updateStatusBarTheme();
    setInterval(updateSystemTime, 30000);
    window.addEventListener('hashchange', updateStatusBarTheme);
  </script>
</body>
</html>
