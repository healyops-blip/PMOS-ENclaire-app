<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Pomi Flutter mobile app.">
  <title>Pomi</title>
  <style>
    @font-face {
      font-family: 'Noto Sans SC';
      src: url('assets/assets/fonts/NotoSansSC-Regular.ttf') format('truetype');
      font-style: normal;
      font-weight: 400;
      font-display: block;
    }
    @font-face {
      font-family: 'Noto Sans SC';
      src: url('assets/assets/fonts/NotoSansSC-Medium.ttf') format('truetype');
      font-style: normal;
      font-weight: 500;
      font-display: block;
    }
    @font-face {
      font-family: 'Noto Sans SC';
      src: url('assets/assets/fonts/NotoSansSC-Bold.ttf') format('truetype');
      font-style: normal;
      font-weight: 700;
      font-display: block;
    }
    @font-face {
      font-family: 'Noto Sans SC';
      src: url('assets/assets/fonts/NotoSansSC-ExtraBold.ttf') format('truetype');
      font-style: normal;
      font-weight: 800;
      font-display: block;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f8f5fa;
      font-family: 'Noto Sans SC', sans-serif;
    }
  </style>
</head>
<body>
  <script>
    // Prevent an older Flutter service worker from serving stale Dart output
    // in the local preview. The preview is intentionally a live build, not a
    // PWA cache.
    (async () => {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
      }
      const script = document.createElement('script');
      // Keep local preview builds out of the browser's script cache.
      script.src = 'flutter_bootstrap.js?v=20260829-0058';
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
