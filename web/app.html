<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Pomi Flutter mobile app.">
  <title>Pomi</title>
  <style>
    @font-face {
      font-family: 'POMI Noto Sans SC Subset';
      src: url('assets/assets/fonts/pomi_web_subset/NotoSansSC-Regular.ttf') format('truetype');
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'POMI Noto Sans SC Subset';
      src: url('assets/assets/fonts/pomi_web_subset/NotoSansSC-Medium.ttf') format('truetype');
      font-style: normal;
      font-weight: 500;
      font-display: swap;
    }
    @font-face {
      font-family: 'POMI Noto Sans SC Subset';
      src: url('assets/assets/fonts/pomi_web_subset/NotoSansSC-Bold.ttf') format('truetype');
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: 'POMI Noto Sans SC Subset';
      src: url('assets/assets/fonts/pomi_web_subset/NotoSansSC-ExtraBold.ttf') format('truetype');
      font-style: normal;
      font-weight: 800;
      font-display: swap;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f8f5fa;
      font-family: 'POMI Noto Sans SC Subset', sans-serif;
    }

    #pomi-loading {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #6a4c93;
      background:
        radial-gradient(circle at 100% 0%, rgba(221, 245, 255, .72), transparent 54%),
        radial-gradient(circle at 100% 36%, rgba(110, 80, 230, .30), transparent 58%),
        radial-gradient(circle at 0% 72%, rgba(242, 154, 211, .28), transparent 62%),
        #fffefa;
      font-size: 14px;
      font-weight: 700;
      transition: opacity 180ms ease;
    }

    #pomi-loading.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .pomi-loading-spinner {
      width: 30px;
      height: 30px;
      box-sizing: border-box;
      border: 3px solid rgba(106, 76, 147, .18);
      border-top-color: #6a4c93;
      border-radius: 50%;
      animation: pomi-spin 800ms linear infinite;
    }

    @keyframes pomi-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .pomi-loading-spinner { animation-duration: 1600ms; }
    }
  </style>
</head>
<body>
  <div id="pomi-loading" role="status" aria-live="polite">
    <span class="pomi-loading-spinner" aria-hidden="true"></span>
    <span>POMI 加载中…</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      const loading = document.getElementById('pomi-loading');
      if (!loading) return;
      loading.classList.add('is-hidden');
      window.setTimeout(() => loading.remove(), 220);
    }, { once: true });

    // Prevent an older Flutter service worker from serving stale Dart output
    // in the local preview. The preview is intentionally a live build, not a
    // PWA cache.
    (async () => {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
      }
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
