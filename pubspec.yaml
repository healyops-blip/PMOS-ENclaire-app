name: pmos_enclaire
description: POMI — PCOS follow-up preparation mobile client.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  file_picker: ^12.1.1
  fl_chart: ^1.2.0
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.0
  go_router: ^18.0.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  printing: ^5.15.0
  shared_preferences: ^2.5.5
  table_calendar: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/POMI-logo.svg
    - assets/brand/POMI-logo-mark.svg
    - assets/data/pomi_medications_v2.json
    - assets/data/smoke_dataset/
    - assets/data/smoke_dataset/_clean_bases/
    - assets/data/smoke_dataset/影像文字报告/
    - assets/data/smoke_dataset/化验_检测报告/
    - assets/data/smoke_dataset/医嘱_处方/
    - assets/data/smoke_dataset/门诊病历_就诊记录/
    - assets/images/pomie_thinking.gif
    - assets/images/pomie_questioning.gif
    - assets/images/pomi_verified_stamp.png
  fonts:
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansSC-ExtraBold.ttf
          weight: 800
    - family: POMI Noto Sans SC Subset
      fonts:
        - asset: assets/fonts/pomi_web_subset/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/pomi_web_subset/NotoSansSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/pomi_web_subset/NotoSansSC-Bold.ttf
          weight: 700
        - asset: assets/fonts/pomi_web_subset/NotoSansSC-ExtraBold.ttf
          weight: 800
