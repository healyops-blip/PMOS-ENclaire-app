name: pmos_enclaire
description: "PMOS ENclaire mobile application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  cupertino_icons: 1.0.9
  dio: 5.11.0
  file_picker: 10.3.10
  fl_chart: 1.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  flutter_secure_storage: 10.3.1
  go_router: 18.0.0
  image_picker: 1.2.3
  intl: 0.20.3
  pdf: 3.13.0
  printing: 5.15.0
  shared_preferences: 2.5.5
  table_calendar: 3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # 2.3.x switched to JNI and asks Flutter to install its default NDK 28.
  # Keep the non-JNI implementation so this project can stay on NDK 30.
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true
  assets:
    - assets/images/pomi_logo.png
    - assets/demo/
