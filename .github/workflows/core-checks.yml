name: Core checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check formatting and conflict markers
        shell: bash
        run: |
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD

          if git grep -n -I -E '^(<<<<<<< |>>>>>>> )' -- .; then
            echo "Merge conflict markers are committed."
            exit 1
          fi

      - name: Block sensitive files
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            case "$file" in
              *.example|*.sample|*.template)
                ;;
              .env|.env.*|*/.env|*/.env.*|*.pem|*.key|id_rsa|*/id_rsa)
                echo "Sensitive file must not be committed: $file"
                failed=1
                ;;
            esac
          done < <(git ls-files -z)
          exit "$failed"

      - name: Block files larger than 10 MiB
        shell: bash
        run: |
          max_bytes=$((10 * 1024 * 1024))
          failed=0

          while IFS= read -r -d '' file; do
            [[ -f "$file" ]] || continue
            size=$(wc -c < "$file")
            if (( size > max_bytes )); then
              echo "File exceeds 10 MiB: $file ($size bytes)"
              failed=1
            fi
          done < <(git ls-files -z)

          exit "$failed"
