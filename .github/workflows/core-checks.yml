name: Core checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: core-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Validate FastAPI backend
        working-directory: backend
        env:
          POMI_DATABASE_URL: sqlite:////tmp/pomi-ci.db
        run: |
          python -m pip install -e '.[dev]'
          ruff format --check .
          ruff check .
          pytest -W error
          python -m alembic upgrade head
          python -m alembic check

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Set up Android NDK 30
        shell: bash
        run: |
          sdkmanager="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "ndk;30.0.16138531"

      - name: Use the official Gradle distribution on GitHub runners
        shell: bash
        run: |
          sed -i \
            's#mirrors.cloud.tencent.com/gradle#services.gradle.org/distributions#' \
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Validate Flutter project
        shell: bash
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test
          flutter build apk --debug

      - name: Check repository hygiene
        shell: bash
        run: |
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD

          if git grep -n -I -E '^(<<<<<<< |>>>>>>> )' -- .; then
            echo "Merge conflict markers are committed."
            exit 1
          fi

          failed=0
          while IFS= read -r -d '' file; do
            case "$file" in
              *.example|*.sample|*.template)
                ;;
              .env|.env.*|*/.env|*/.env.*|*.pem|*.key|id_rsa|*/id_rsa)
                echo "Sensitive file must not be committed: $file"
                failed=1
                ;;
            esac
          done < <(git ls-files -z)

          max_bytes=$((10 * 1024 * 1024))
          while IFS= read -r -d '' file; do
            [[ -f "$file" ]] || continue
            size=$(wc -c < "$file")
            if (( size > max_bytes )); then
              echo "File exceeds 10 MiB: $file ($size bytes)"
              failed=1
            fi
          done < <(git ls-files -z)

          exit "$failed"
