name: Core checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: core-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Validate Flutter project
        shell: bash
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test
          flutter build apk --debug

      - name: Check repository hygiene
        shell: bash
        run: |
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD

          if git grep -n -I -E '^(<<<<<<< |>>>>>>> )' -- .; then
            echo "Merge conflict markers are committed."
            exit 1
          fi

          failed=0
          while IFS= read -r -d '' file; do
            case "$file" in
              *.example|*.sample|*.template)
                ;;
              .env|.env.*|*/.env|*/.env.*|*.pem|*.key|id_rsa|*/id_rsa)
                echo "Sensitive file must not be committed: $file"
                failed=1
                ;;
            esac
          done < <(git ls-files -z)

          max_bytes=$((10 * 1024 * 1024))
          while IFS= read -r -d '' file; do
            [[ -f "$file" ]] || continue
            size=$(wc -c < "$file")
            if (( size > max_bytes )); then
              echo "File exceeds 10 MiB: $file ($size bytes)"
              failed=1
            fi
          done < <(git ls-files -z)

          exit "$failed"
