limit_req_zone $binary_remote_addr zone=pomi_auth:10m rate=10r/m;

upstream pomi_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.healy1012-ops.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.healy1012-ops.top;

    ssl_certificate /etc/letsencrypt/live/api.healy1012-ops.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.healy1012-ops.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PomiTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 25m;
    client_body_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    access_log /var/log/nginx/pomi-api-access.log;
    error_log /var/log/nginx/pomi-api-error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /api/auth/register {
        limit_req zone=pomi_auth burst=5 nodelay;
        proxy_pass http://pomi_api;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Server;
    }

    location = /api/auth/login {
        limit_req zone=pomi_auth burst=5 nodelay;
        proxy_pass http://pomi_api;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Server;
    }

    location / {
        proxy_pass http://pomi_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Server;
    }
}
